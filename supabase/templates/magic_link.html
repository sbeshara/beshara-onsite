<!doctype html>
<html>
<body style="margin:0;padding:0;background:#F0F3F1;font-family:Helvetica,Arial,sans-serif;color:#151B18">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F0F3F1;padding:32px 12px">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#FFFFFF;border:1px solid #DCE3DF;border-radius:14px;overflow:hidden">
        <tr><td style="background:#455C51;padding:22px 28px">
          <img src="{{ .SiteURL }}/logo.png" alt="Beshara Builders" height="44" style="display:inline-block;height:44px;vertical-align:middle;border:0">
          <span style="display:inline-block;vertical-align:middle;margin-left:14px;padding-left:14px;border-left:1px solid rgba(255,255,255,.3);color:#FFFFFF;font-family:Georgia,serif;font-style:italic;font-size:18px">OnSite</span>
        </td></tr>
        <tr><td style="padding:28px">
          <h1 style="margin:0 0 14px;font-family:Didot,'Bodoni 72',Georgia,serif;font-weight:normal;font-size:28px;line-height:1.15">Your sign-in link</h1>
          <p style="margin:0 0 12px;font-size:15px;line-height:1.55">Use the button below to sign in to Beshara OnSite. No password needed.</p>
          <p style="margin:22px 0">
            <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/" style="display:inline-block;background:#455C51;color:#FFFFFF;text-decoration:none;font-weight:bold;padding:12px 20px;border-radius:10px">Sign in to OnSite</a>
          </p>
          <p style="margin:0;font-size:12.5px;line-height:1.5;color:#5D6A64">This link works once and expires in 1 hour. If you didn't ask for it, you can ignore this email.</p>
        </td></tr>
        <tr><td style="padding:16px 28px;border-top:1px solid #DCE3DF;font-size:12px;color:#5D6A64">Beshara Builders · Healthcare construction management · New Jersey</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
